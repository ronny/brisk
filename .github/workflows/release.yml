name: Release

# On a semantic version tag (vX.Y.Z, such as v0.1.0), test, build static
# brisk binaries for linux, darwin and windows on amd64 and arm64, and attach
# them with SHA-256 sums to a GitHub release. Each target builds on its own
# runner, at the same time as the tests. `brisk --version` and
# provenance.brisk_version report the tag.
#
# Run it by hand (workflow_dispatch) for a dry run: it tests and builds every
# target with the version dev-<commit>, and publishes nothing.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: write

env:
  CGO_ENABLED: "0"
  TAG: ${{ github.event_name == 'push' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is vX.Y.Z
        if: github.event_name == 'push'
        run: '[[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "not a vX.Y.Z tag: $TAG"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64, windows/arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        id: build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          os=${TARGET%/*}; arch=${TARGET#*/}; ext=""; [ "$os" = windows ] && ext=.exe
          name="brisk-$TAG-$os-$arch$ext"
          mkdir dist
          GOOS=$os GOARCH=$arch go build -trimpath \
            -ldflags "-s -w -X github.com/ronny/brisk/assess.Version=$TAG" \
            -o "dist/$name" ./cmd/brisk
          if [ "$TARGET" = linux/amd64 ]; then
            "./dist/$name" --version | grep -qx "brisk $TAG"
            file "dist/$name" | grep -q 'statically linked'
          fi
          echo "artifact=brisk-$os-$arch" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: brisk-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          test "$(ls dist | wc -l)" -eq 6
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$TAG" dist/* --title "brisk $TAG" --generate-notes --verify-tag
