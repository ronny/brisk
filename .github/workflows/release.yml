name: Release

# On a version tag (vYYYYMMDD-NN, the Melbourne date and a sequence number),
# test, then build static brisk binaries for linux, darwin and windows on
# amd64 and arm64, and attach them with SHA-256 sums to a GitHub release.
# `brisk --version` and provenance.brisk_version report the tag.

on:
  push:
    tags: ['v[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[0-9][0-9]']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/ronny/brisk/assess.Version=$TAG" \
              -o "dist/brisk-$TAG-$os-$arch$ext" ./cmd/brisk
          done
          ./dist/brisk-$TAG-linux-amd64 --version | grep -qx "brisk $TAG"
          file dist/brisk-$TAG-linux-amd64 | grep -q 'statically linked'
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "brisk $TAG" --generate-notes --verify-tag
